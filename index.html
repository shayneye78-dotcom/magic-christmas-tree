<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>魔法圣诞树</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
#scene{z-index:0}#up,#three,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}#up{z-index:2}#three{z-index:3}#fx{z-index:4}

/*
VOICE: 温柔、闪亮、像童话夜晚，一步一步引导
IDEA: 仙女棒在夜空中施魔法——一棵由光点组成的树
PICTURE: 全屏粒子圣诞树、礼物、圣诞老人与雪橇
COLOUR and TYPE: 深夜蓝黑底 + 金色魔法光；Great Vibes 手写体 + 系统中文字体
LAYOUT: 顶部选色转盘、底部引导气泡、右下摄像头小窗、左侧步骤
*/
:root{--gold:#ffd77a;--gold2:#ffeab0;--ink:#fff8ec;--glass:rgba(16,18,36,.55);--line:rgba(255,215,122,.35)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#05070f;color:var(--ink);
  font:15px/1.5 "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:18px}

/* 顶部选择器 */
#picker{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(760px,96vw);padding:8px 10px 10px;transition:opacity .5s,transform .5s;z-index:5}
#picker.hide{opacity:0;pointer-events:none;transform:translate(-50%,-20px)}
.ptabs{display:flex;justify-content:center;gap:6px;margin-bottom:6px}
.ptab{border:1px solid transparent;background:none;padding:3px 14px;border-radius:99px;font-size:13px;opacity:.7}
.ptab.on{border-color:var(--line);background:rgba(255,215,122,.12);opacity:1;color:var(--gold2)}
.ptab[hidden]{display:none}
.prow{display:flex;align-items:center;gap:6px}
.arrow{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:18px;line-height:1}
.arrow:hover{background:rgba(255,215,122,.15)}
.viewport{flex:1;overflow:hidden;position:relative;height:92px;mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
#prev.armed,#next.armed{transform:scale(1.25);box-shadow:0 0 18px rgba(255,214,120,.9);background:rgba(255,214,120,.35)}
.track{position:absolute;left:0;top:0;display:flex;gap:10px;transition:transform .55s cubic-bezier(.2,.9,.25,1.1)}
.item{width:118px;height:88px;flex:none;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:all .4s;opacity:.55;transform:scale(.88)}
.item.on{opacity:1;transform:scale(1);border-color:var(--gold);box-shadow:0 0 22px rgba(255,215,122,.35),inset 0 0 18px rgba(255,215,122,.08)}
.sw{width:46px;height:46px;border-radius:50%;box-shadow:0 0 14px rgba(255,255,255,.18)}
.sw.tree{border-radius:50% 50% 8px 8px / 80% 80% 8px 8px;clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:0;width:44px;height:46px}
.iname{font-size:13px;white-space:nowrap}

/* 引导气泡 */
#hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:12px 18px 12px 14px;max-width:min(620px,94vw);z-index:5;transition:opacity .4s}
#hint.hide{opacity:0;pointer-events:none}
#hintIcon{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle,rgba(255,215,122,.25),transparent 70%);position:relative}
#hintIcon svg{position:absolute;inset:0;transform:rotate(-90deg)}
#hintTitle{font-size:16px;font-weight:600;color:var(--gold2)}
#hintSub{font-size:13px;opacity:.82}
#hintBtn{flex:none;border:1px solid var(--gold);background:rgba(255,215,122,.14);color:var(--gold2);border-radius:99px;padding:8px 14px;font-size:13px;white-space:nowrap}
#hintBtn:hover{background:rgba(255,215,122,.28)}
#hintBtn[hidden]{display:none}

/* 步骤 */
#steps{position:fixed;left:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:4}
.step{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.38;transition:all .4s}
.step b{width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;font-size:12px;font-weight:500}
.step.on{opacity:1;color:var(--gold2)}.step.on b{border-color:var(--gold);background:rgba(255,215,122,.2);box-shadow:0 0 12px rgba(255,215,122,.5)}
.step.done{opacity:.7}.step.done b{background:var(--gold);color:#3a2600;border-color:var(--gold)}

/* 礼物托盘 */
#tray{position:fixed;right:16px;top:50%;transform:translateY(-50%);padding:10px 8px;display:flex;flex-direction:column;gap:6px;z-index:4;transition:opacity .4s}
#tray.hide{opacity:0;pointer-events:none}
#tray .tt{font-size:12px;text-align:center;opacity:.75}
.gbtn{width:64px;height:58px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);padding:0;position:relative}
.gbtn canvas{width:64px;height:58px;display:block}
.gbtn.next{border-color:var(--gold);box-shadow:0 0 14px rgba(255,215,122,.4)}
.gbtn.used{opacity:.35}
.gbtn.used::after{content:"✓";position:absolute;right:4px;top:2px;font-size:12px;color:var(--gold)}

/* 摄像头 */
#cam{position:fixed;right:16px;bottom:18px;width:208px;height:156px;border-radius:14px;overflow:hidden;z-index:4;border:1px solid var(--line);background:#000;display:none}
#cam.show{display:block}
#cam video,#cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#cam video{opacity:.55}
#camTag{position:absolute;left:6px;bottom:6px;right:6px;font-size:12px;padding:3px 8px;border-radius:8px;background:rgba(0,0,0,.55);text-align:center}
#camTag:empty{display:none}

#topRight{position:fixed;right:16px;top:16px;display:flex;gap:8px;z-index:6}
.ibtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--glass);font-size:16px}

/* 开始界面 */
.overlay{position:fixed;inset:0;display:grid;place-items:center;z-index:10;background:radial-gradient(ellipse at 50% 40%,rgba(30,20,60,.55),rgba(3,4,10,.92));transition:opacity .6s}
.overlay.hide{opacity:0;pointer-events:none}
.introBox{text-align:center;padding:30px 26px;max-width:min(640px,92vw)}
.introBox h1{font:400 clamp(52px,9vw,96px)/1 "Great Vibes",cursive;margin:0;color:var(--gold);text-shadow:0 0 28px rgba(255,200,90,.55)}
.introBox .cn{font-size:20px;letter-spacing:.2em;margin:6px 0 18px;color:var(--gold2)}
.introBox p{opacity:.85;margin:0 0 20px}
.gestures{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:0 0 24px}
.gestures div{padding:10px 4px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:12px}
.gestures span{display:block;font-size:26px;margin-bottom:4px}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{border-radius:99px;padding:12px 26px;font-size:16px;border:1px solid var(--gold);background:linear-gradient(180deg,#ffe29a,#e9b54c);color:#3b2400;font-weight:600;box-shadow:0 0 24px rgba(255,200,90,.35)}
.btn.ghost{background:transparent;color:var(--gold2);font-weight:500;box-shadow:none}
.note{font-size:12px;opacity:.6;margin-top:16px}
#camErr{color:#ffb4a8;font-size:13px;margin-top:12px;min-height:1em}

/* 贺卡 */
#card .cardWrap{display:flex;gap:24px;align-items:center;padding:20px;max-width:96vw;max-height:96vh}
#cardImg{max-height:88vh;max-width:min(520px,60vw);border-radius:16px;box-shadow:0 0 50px rgba(255,210,120,.3);display:block}
.cardSide{width:260px;display:flex;flex-direction:column;gap:12px}
.cardSide h2{font:400 44px/1 "Great Vibes",cursive;color:var(--gold);margin:0}
.cardSide label{font-size:13px;opacity:.8;display:flex;flex-direction:column;gap:4px}
.cardSide input{font:inherit;font-size:16px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);user-select:text}
.cardSide input:focus{outline:2px solid var(--gold);outline-offset:1px}
.cardSide .btn{padding:10px 18px;font-size:15px}
@media (max-width:760px){
  #steps .step span{display:none}
  #cam{width:132px;height:99px;bottom:auto;top:auto;right:10px;bottom:120px}
  #picker{top:60px}
  #tray{right:auto;left:50%;top:auto;bottom:112px;transform:translateX(-50%);flex-direction:row;padding:6px}
  #tray .tt{display:none}
  #cam{bottom:170px}
  .gbtn,.gbtn canvas{width:40px;height:36px}
  .item{width:92px}
  .gestures{grid-template-columns:repeat(3,minmax(0,1fr))}
  #card .cardWrap{flex-direction:column;overflow:auto}
  #cardImg{max-width:86vw;max-height:58vh}
  .cardSide{width:min(320px,86vw)}
}
@media (prefers-reduced-motion:reduce){.track,.item{transition:none}}
</style>
</head>
<body>
<canvas id="scene"></canvas><canvas id="up"></canvas><canvas id="three"></canvas><canvas id="fx"></canvas>

<div id="picker" class="glass hide">
  <div class="ptabs">
    <button class="ptab on" data-mode="tree">树的颜色</button>
    <button class="ptab" data-mode="light" hidden>装饰灯颜色</button>
  </div>
  <div class="prow">
    <button class="arrow" id="prev" aria-label="上一个">‹</button>
    <div class="viewport"><div class="track" id="track"></div></div>
    <button class="arrow" id="next" aria-label="下一个">›</button>
  </div>
</div>

<div id="steps"></div>

<div id="tray" class="glass hide"><div class="tt">礼物</div></div>

<div id="hint" class="glass hide">
  <div id="hintIcon"><svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="25" fill="none" stroke="rgba(255,215,122,.18)" stroke-width="3"/><circle id="hintRing" cx="27" cy="27" r="25" fill="none" stroke="#ffd77a" stroke-width="3" stroke-linecap="round" stroke-dasharray="157" stroke-dashoffset="157"/></svg><span id="hintEmoji">👋</span></div>
  <div><div id="hintTitle"></div><div id="hintSub"></div></div>
  <button id="hintBtn" hidden></button>
</div>

<div id="cam"><video id="video" playsinline muted></video><canvas id="camCv" width="320" height="240"></canvas><div id="camTag"></div></div>

<div id="topRight">
  <button class="ibtn" id="musicBtn" title="选择背景音乐">🎵</button><input type="file" id="musicFile" accept="audio/*" style="display:none"><button class="ibtn" id="muteBtn" title="声音">🔊</button>
  <button class="ibtn" id="resetBtn" title="重新开始">↺</button>
</div>

<div id="intro" class="overlay">
  <div class="introBox">
    <h1>Magic Tree</h1>
    <div class="cn">挥动仙女棒 · 种一棵会发光的圣诞树</div>
    <p>用摄像头识别你的手势：选颜色、召唤仙女棒、螺旋种树、放礼物，最后用比心召唤圣诞老人。</p>
    <div class="gestures">
      <div><span>☝️</span>食指朝上划一下<br>选颜色</div>
      <div><span>👇</span>食指朝下<br>召唤仙女棒</div>
      <div><span>🌀</span>从下往上螺旋<br>种出圣诞树</div>
      <div><span>🤌</span>聚拢 → 张开<br>放下礼物</div>
      <div><span>🫶</span>双手比心<br>圣诞老人来啦</div>
    </div>
    <div class="cta">
      <button class="btn" id="startCam">开启摄像头开始</button>
      <button class="btn ghost" id="startMouse">用鼠标 / 触屏体验</button>
    </div>
    <div id="camErr"></div>
    <div class="note">建议光线明亮，手离摄像头 40–80 厘米，掌心朝向屏幕。摄像头画面只在本机处理，不会上传。</div>
  </div>
</div>

<div id="card" class="overlay hide">
  <div class="cardWrap">
    <canvas id="cardImg" width="1080" height="1500" role="img" aria-label="你的专属圣诞贺卡"></canvas>
    <div class="cardSide">
      <h2>Your Card</h2>
      <div style="font-size:14px;opacity:.85">这是你亲手种出的圣诞树，圣诞老人已经签好名啦。</div>
      <label>送给<input id="toName" maxlength="16" value="亲爱的你"></label>
      <label>来自<input id="fromName" maxlength="16" value="圣诞老人 & 我"></label>
      <button class="btn" id="saveCard">保存贺卡图片</button>
      <button class="btn ghost" id="closeCard">继续欣赏</button>
      <button class="btn ghost" id="againBtn">再种一棵</button>
    </div>
  </div>
</div>

<script>
{
// ============ 配置 ============
const THEMES=[
 {name:'经典绿色',colors:[['#0d6b3a',3],['#16904c',3],['#2fbf6a',2.4],['#7fe39a',1.2],['#e3ffe8',.5],['#ffd36b',.35]],garland:['#ffd36b','#fff1c1'],star:'#ffd75e',trunk:'#8a5530',glow:'#2fbf6a',sky:['#040b14','#0a2224']},
 {name:'粉色',colors:[['#ff5d8f',2],['#ff8fab',3],['#ffb3c6',3],['#ffd6e3',2],['#fff3f8',1],['#e8a0b4',1]],garland:['#ffffff','#ffd1dc'],star:'#fff1f6',trunk:'#b07a7a',glow:'#ff8fab',sky:['#12060f','#2a1028']},
 {name:'美拉德秋冬色',colors:[['#7a4421',2],['#a0612f',3],['#c58243',3],['#dcaa6e',2],['#efd7b0',1],['#8e3a2c',1.2],['#5e6b3a',.6]],garland:['#f3d9a4','#ffe7bf'],star:'#f6c86b',trunk:'#5a3519',glow:'#c58243',sky:['#0e0805','#26150b']},
 {name:'蓝色',colors:[['#1146a8',2],['#1e6fd9',3],['#4ea8de',3],['#90e0ef',2],['#e4fbff',1],['#7b8fd6',.8]],garland:['#e6f7ff','#bfe9ff'],star:'#eaf7ff',trunk:'#4a5a78',glow:'#4ea8de',sky:['#030817','#0a1a38']},
 {name:'马卡龙彩色',colors:[['#ffadad',1],['#ffd6a5',1],['#fdffb6',1],['#caffbf',1],['#9bf6ff',1],['#a0c4ff',1],['#bdb2ff',1],['#ffc6ff',1]],garland:['#ffffff','#fff5d6'],star:'#fff6c8',trunk:'#c9a27e',glow:'#bdb2ff',sky:['#0c0a1c','#1d1636']},
];
const LIGHTS=[
 {name:'暖金',colors:['#ffd27a','#ffb347','#fff0b3']},
 {name:'缤纷彩灯',colors:['#ff4d4d','#ffd93d','#4dd96b','#4dabff','#ff6ec7']},
 {name:'冰雪白',colors:['#ffffff','#d6f1ff','#a8dcff']},
 {name:'红白糖果',colors:['#ff2e4d','#ffffff','#ff2e4d']},
 {name:'梦幻紫粉',colors:['#c77dff','#ff70a6','#ffd6ff']},
];
// 礼物：每组若干盒子 [dx, w, h, 盒色, 丝带色, 叠放在第几个盒子上(-1地面)]
// 每个树主题一套礼物配色：a 主色 / b 浅色 / c 点缀色 / m 金属色 / r 浅丝带
const GIFT_PAL=[
 {a:'#c8102e',b:'#f6efe2',c:'#1e7a46',m:'#d8b15a',r:'#fff6df'},   // 经典绿色：红 / 奶白 / 墨绿 / 金
 {a:'#ff6f9c',b:'#fff3f7',c:'#c6a3e8',m:'#e8bfa2',r:'#ffffff'},   // 粉色：玫粉 / 白 / 淡紫 / 玫瑰金
 {a:'#8e3a2c',b:'#f1dfc0',c:'#5e6b3a',m:'#c9965a',r:'#fff2da'},   // 美拉德：酒红 / 奶油 / 橄榄绿 / 焦糖
 {a:'#1f3f8f',b:'#ffffff',c:'#8fd6ee',m:'#c5ccd8',r:'#ffffff'},   // 蓝色：藏青 / 白 / 冰蓝 / 银
 {a:'#ff9fa8',b:'#c7f5be',c:'#a7c7ff',m:'#fff1a8',r:'#ffffff'},   // 马卡龙：粉 / 薄荷 / 天蓝 / 奶黄
];
// 礼物组合：[形状, 横向偏移, 前后(正=靠前), 宽, 高, 颜色, 丝带色, 叠在第几个上(-1=地面)]
const GIFTS=[
 {name:'叠叠高',items:[['box',-.02,0,.38,.30,'a','m',-1],['box',.04,0,.27,.22,'b','a',0],['box',-.01,0,.17,.15,'c','m',1]]},
 {name:'礼帽盒',items:[['cyl',-.07,0,.36,.30,'m','a',-1],['ball',.23,.07,.13,.13,'a','m',-1],['ball',.32,-.03,.09,.09,'c','m',-1]]},
 {name:'宽扁盒',items:[['box',0,0,.5,.17,'c','r',-1],['box',.07,0,.22,.19,'a','m',0]]},
 {name:'三只小礼物',items:[['box',-.03,-.08,.17,.15,'c','m',-1],['box',-.17,.04,.21,.19,'a','r',-1],['box',.11,.06,.19,.24,'b','a',-1]]},
 {name:'高礼盒',items:[['box',-.06,0,.23,.44,'b','a',-1],['ball',.17,.07,.12,.12,'m','a',-1]]},
];
const STEPS=['选颜色','召唤仙女棒','螺旋种树','挂灯 · 放礼物','双手比心'];

// ============ 基础 ============
const cv=document.getElementById('scene');let ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,F=1,CX=0,CY=0;const CAMZ=6;
const bg=document.createElement('canvas'),bgx=bg.getContext('2d');
const $=id=>document.getElementById(id);
const upc=$('up'),fxc=$('fx');window.__up=upc.getContext('2d');window.__fx=fxc.getContext('2d');
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const hexRgb=h=>{if(h.length===4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]};
function pickWeighted(list){let s=0;for(const c of list)s+=c[1];let r=Math.random()*s;for(let i=0;i<list.length;i++){r-=list[i][1];if(r<=0)return i}return list.length-1}

const spriteCache={};
function sprite(color,kind){
  const key=color+kind;if(spriteCache[key])return spriteCache[key];
  const s=kind==='glow'?64:32,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');
  const [r,gg,b]=hexRgb(color),gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  if(kind==='glow'){gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.14,`rgba(${r},${gg},${b},1)`);gr.addColorStop(.4,`rgba(${r},${gg},${b},.35)`);gr.addColorStop(1,`rgba(${r},${gg},${b},0)`)}
  else{ // 清晰的实心粒子：硬边核心 + 很淡的光晕 + 一点高光
    gr.addColorStop(0,`rgba(${r},${gg},${b},.22)`);gr.addColorStop(.55,`rgba(${r},${gg},${b},.08)`);gr.addColorStop(1,`rgba(${r},${gg},${b},0)`);
    g.fillStyle=gr;g.fillRect(0,0,s,s);
    const cg=g.createRadialGradient(s*.42,s*.4,0,s/2,s/2,s*.3);cg.addColorStop(0,`rgb(${Math.min(255,r+90)},${Math.min(255,gg+90)},${Math.min(255,b+90)})`);cg.addColorStop(.45,`rgb(${r},${gg},${b})`);cg.addColorStop(1,`rgb(${Math.round(r*.8)},${Math.round(gg*.8)},${Math.round(b*.8)})`);
    g.fillStyle=cg;g.beginPath();g.arc(s/2,s/2,s*.3,0,7);g.fill();return spriteCache[key]=c}
  g.fillStyle=gr;g.fillRect(0,0,s,s);return spriteCache[key]=c;
}

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;

  F=Math.min(H*1.1,W*1.5);CX=W/2;CY=H*0.55;
  drawBg();layoutText();buildSpiral();
}
function drawBg(){

  const th=THEMES[S.theme],g=bgx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,th.sky[0]);g.addColorStop(.7,th.sky[1]);g.addColorStop(1,'#020308');
  bgx.fillStyle=g;bgx.fillRect(0,0,W,H);

  const gy=CY+1.27*F/CAMZ, hz=bgx.createRadialGradient(CX,gy,0,CX,gy,W*.7);
  hz.addColorStop(0,'rgba(200,220,255,.10)');hz.addColorStop(1,'rgba(200,220,255,0)');bgx.fillStyle=hz;bgx.fillRect(0,0,W,H);

const TOP=1.28,BASE=-1.02,TH=TOP-BASE,TIERS=6;
function drawOccluder(){const a=window.__occ||0;if(a<=0.01||S.grow<1)return;ctx.save();ctx.globalAlpha=a;ctx.beginPath();
  for(let i=0;i<=48;i++){const h=i/48,r=radiusAt(h)*.93,p=proj(r,BASE+h*TH,0);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}
  for(let i=48;i>=0;i--){const h=i/48,r=radiusAt(h)*.93,p=proj(-r,BASE+h*TH,0);ctx.lineTo(p.x,p.y)}
  ctx.closePath();const c0=THEMES[S.theme].colors[0][0],bp=proj(0,BASE+TH*.3,0),g=ctx.createRadialGradient(bp.x,bp.y,0,bp.x,bp.y,bp.s*1.6);
  g.addColorStop(0,shadeHex(c0,-.45));g.addColorStop(1,shadeHex(c0,-.7));ctx.fillStyle=g;ctx.fill();ctx.restore()}
function radiusAt(h){const env=1.08*Math.pow(1-h,1.02);const f=(h*TIERS)%1;return env*(1-.26*f)+.02}
const body=[],garland=[],lights=[],star=[],trunk=[],ground=[];
function buildTree(){
  body.length=garland.length=lights.length=star.length=trunk.length=ground.length=0;
  for(let i=0;i<4600;i++){
    const h=1-Math.sqrt(Math.random())*.995;const R=radiusAt(h)*(.55+.45*Math.sqrt(Math.random()));
    body.push({h,r:R,a:Math.random()*Math.PI*2,y:BASE+h*TH+rand(-.03,.03),sz:rand(.014,.028),c:[],ph:Math.random()*7,rnd:Math.random()});
  }
  for(const p of body)p.c=THEMES.map(t=>pickWeighted(t.colors));
  for(let k=0;k<2;k++)for(let i=0;i<300;i++){const u=i/300,h=u*.93;garland.push({h,r:radiusAt(h)*1.03,a:u*Math.PI*2*5.5+k*Math.PI,y:BASE+h*TH,sz:rand(.012,.02),ph:Math.random()*7,rnd:Math.random(),k:i%2})}
  for(let s=0;s<3;s++)for(let i=0;i<55;i++){const u=(i+Math.random()*.5)/55,h=u*.9+.02;lights.push({h,r:radiusAt(h)*1.06,a:u*Math.PI*2*4+s*2.094,y:BASE+h*TH+rand(-.04,.04),ci:(i+s)%5,ph:Math.random()*7,sp:rand(1.5,3.5),rnd:Math.random()})}
  for(let i=0;i<160;i++){const t=i/160*Math.PI*2,k=Math.floor(i/16),f=(i%16)/16;
    const a0=-Math.PI/2+k*Math.PI*2/10,a1=-Math.PI/2+(k+1)*Math.PI*2/10,r0=k%2?.075:.18,r1=k%2?.18:.075;
    const x0=Math.cos(a0)*r0,y0=Math.sin(a0)*r0,x1=Math.cos(a1)*r1,y1=Math.sin(a1)*r1;
    star.push({x:lerp(x0,x1,f),y:-lerp(y0,y1,f),ph:Math.random()*7})}
  for(let i=0;i<70;i++)star.push({x:rand(-.07,.07),y:rand(-.07,.07),ph:Math.random()*7,fill:1});
  for(let i=0;i<90;i++){const h=Math.random();trunk.push({r:Math.sqrt(Math.random())*.11,a:Math.random()*7,y:-1.27+h*.3,sz:rand(.02,.035)})}
  for(let i=0;i<420;i++){const r=Math.sqrt(Math.random())*2.3;ground.push({r,a:Math.random()*7,y:-1.28+rand(-.01,.01),sz:rand(.008,.02),ph:Math.random()*7})}
}

// 生长：粒子从底部魔法圈螺旋上升
function growPos(p,out){
  const delay=p.h*.86+p.rnd*.06,k=clamp((S.grow-delay)/.18,0,1);
  if(k<=0)return false;const e=easeOut(k);
  out.r=lerp(p.r+.5,p.r,e);out.y=lerp(p.y-.22,p.y,e);out.a=p.a+(1-e)*2.4;out.k=k;return true;
}
const gf=new Uint8Array(6000);
// 螺旋引导路径（从树底往上绕）
const SPN=260;let spiralPts=[];
function buildSpiral(){spiralPts=[];for(let k=0;k<=SPN;k++){const u=k/SPN,h=u*.97,th=u*Math.PI*2*3.2+.6,r=1.08*Math.pow(1-h,1.02)*1.22+.12,x=Math.sin(th)*r,z=Math.cos(th)*r,q=proj(x,BASE+h*TH,z);spiralPts.push({x:q.x,y:q.y,z})}}
const zs=new Float32Array(6000),idx=new Uint16Array(6000),px=new Float32Array(6000),py=new Float32Array(6000),ps=new Float32Array(6000);
const tmp={r:0,y:0,a:0,k:1};

function drawTree(){
  const showGhost=['intro','select','spiral'].includes(S.stage),ghost=S.grow<=0;if(ghost&&!showGhost)return;
  const ghostA=S.stage==='spiral'?.14:.2,full=S.grow>=1.2;

  const [r0,g0,b0]=hexRgb(th.glow);rg.addColorStop(0,`rgba(${r0},${g0},${b0},${.22*gk})`);rg.addColorStop(1,`rgba(${r0},${g0},${b0},0)`);
  ctx.globalAlpha=1;ctx.fillStyle=rg;ctx.save();ctx.translate(bp.x,bp.y);ctx.scale(1,.32);ctx.beginPath();ctx.arc(0,0,bp.s*1.6,0,7);ctx.restore();ctx.fill();

  for(const p of trunk){if(S.grow<.05||ghost)break;const a=p.a+rot,pp=proj(Math.cos(a)*p.r,p.y,Math.sin(a)*p.r);ctx.globalAlpha=.9;const s=p.sz*pp.s*2;ctx.drawImage(sprite(th.trunk,'dot'),pp.x-s/2,pp.y-s/2,s,s)}
  // 主体 + 彩带 深度排序
  let n=0;const all=body.length+garland.length;
  for(let i=0;i<all;i++){
    const p=i<body.length?body[i]:garland[i-body.length];
    gf[i]=0;

    else if(S.grow>0&&growPos(p,tmp)){}
    else if(showGhost&&i<body.length&&i%3===0){tmp.r=p.r;tmp.y=p.y;tmp.a=p.a;tmp.k=1;gf[i]=1}
    else continue;
    const a=tmp.a+rot,x=Math.cos(a)*tmp.r,z=Math.sin(a)*tmp.r,q=proj(x,tmp.y,z);

    if(i<body.length){

      const T=useNew?th:pth,col=T.colors[p.c[useNew?S.theme:S.prevTheme]][0];

const sparks=[];
function spark(x,y,col,n=1,spd=1,size=1){for(let i=0;i<n;i++){const a=Math.random()*7,v=rand(.2,1.6)*spd*40;sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-10*spd,life:0,max:rand(.5,1.2),col,sz:rand(4,11)*size})}}

// ============ 礼物 ============
const SLOTS=[{x:-1.2,z:.36,s:.9},{x:-.72,z:.96,s:1.02},{x:-1.3,z:1.12,s:1.1},{x:.8,z:1.0,s:1.06},{x:1.28,z:.42,s:.93}];   // 左边三堆（后 / 中 / 前外）+ 右边两堆（前 / 后），中间留出树干
function slotWorld(i){const o=SLOTS[i];return{x:o.x,y:-1.28,z:o.z}}
const hex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');
function shadeHex(h,k){const [r,g,b]=hexRgb(h),f=v=>k>0?v+(255-v)*k:v*(1+k);return hex(f(r),f(g),f(b))}

  const bow=(cx,cy,w,rib)=>{const rT=shadeHex(rib,.25),rD=shadeHex(rib,-.2),L=Math.max(.06,w*.17);   // 蝴蝶结：两个圈 + 两条飘带 + 结
    for(const sd of[-1,1]){for(let i=0;i<30;i++){const a=i/30*Math.PI*2,ex=Math.cos(a)*L,ey=Math.sin(a)*L*.55,ro=sd*-.55;add(cx+sd*L+ex*Math.cos(ro)-ey*Math.sin(ro),cy-L*.45+ex*Math.sin(ro)+ey*Math.cos(ro),i%3?rT:rib,st*.9,1)}
      for(let i=0;i<10;i++)add(cx+sd*(L*.15+i*L*.07),cy+i*L*.09,rD,st*.85,1)}
    for(let i=0;i<14;i++){const a=Math.random()*7,r=Math.random()*L*.28;add(cx+Math.cos(a)*r,cy-L*.15+Math.sin(a)*r,rib,st*.9,1)}};
  const box=(bx,by,w,h,col,rib,hasBow)=>{
    const d=w*.32,dx=d*.62,dy=d*.45,rw=w*.15,cS=shadeHex(col,-.42),cT=shadeHex(col,.3),rS=shadeHex(rib,-.25),rT=shadeHex(rib,.2),ec=shadeHex(col,.6);
    const ns=Math.max(2,Math.round(dx/st)),nh=Math.max(2,Math.round(h/st)),nw=Math.max(2,Math.round(w/st)),nd=Math.max(2,Math.round(dy/st));
    for(let i=0;i<=ns;i++)for(let j=0;j<=nh;j++){const sx=i/ns;add(bx+w/2+dx*sx,by-h*j/nh-dy*sx,Math.abs(sx-.5)*dx<rw*.35?rS:cS,st*1.05,0)}         // 侧面：竖着的丝带
    for(let i=0;i<=nw;i++)for(let j=0;j<=nh;j++){const x=bx-w/2+w*i/nw;add(x,by-h*j/nh,Math.abs(x-bx)<rw/2?rib:col,st*1.05,0)}                 // 正面：竖着的丝带
    for(let i=0;i<=nw;i++)for(let j=0;j<=nd;j++){const sx=i/nw,q=j/nd;add(bx-w/2+w*sx+dx*q,by-h-dy*q,(Math.abs(sx-.5)*w<rw/2||Math.abs(q-.5)<.22)?rT:cT,st*1.05,0)}   // 盒盖：十字丝带
    const E=[[bx-w/2,by,bx+w/2,by],[bx-w/2,by-h,bx+w/2,by-h],[bx-w/2,by,bx-w/2,by-h],[bx+w/2,by,bx+w/2,by-h],[bx+w/2,by,bx+w/2+dx,by-dy],[bx+w/2+dx,by-dy,bx+w/2+dx,by-h-dy],[bx-w/2,by-h,bx-w/2+dx,by-h-dy],[bx-w/2+dx,by-h-dy,bx+w/2+dx,by-h-dy],[bx+w/2,by-h,bx+w/2+dx,by-h-dy]];
    for(const [x0,y0,x1,y1] of E){const n=Math.max(2,Math.round(Math.hypot(x1-x0,y1-y0)/(st*.9)));for(let i=0;i<=n;i++)add(lerp(x0,x1,i/n),lerp(y0,y1,i/n),ec,st*.65,1)}
    if(hasBow)bow(bx+dx/2,by-h-dy/2,w,rib);
    return by-h-dy*.5;
  };
  const cyl=(bx,by,w,h,col,rib,hasBow)=>{   // 礼帽盒：圆筒 + 椭圆盒盖
    const rx=w/2,ry=w*.17,rw=w*.13,nt=Math.max(6,Math.round(Math.PI*rx/st)),nh=Math.max(2,Math.round(h/st)),rT=shadeHex(rib,.2);
    for(let i=0;i<=nt;i++){const th=-Math.PI/2+Math.PI*i/nt,x=bx+Math.sin(th)*rx,sh=-.42+.62*Math.max(0,Math.cos(th+.55)),band=Math.abs(Math.sin(th)*rx)<rw/2;
      for(let j=0;j<=nh;j++){const f=j/nh,y=by-ry+ry*Math.cos(th)-h*f,hb=Math.abs(f-.45)*h<rw*.4;add(x,y,band||hb?shadeHex(rib,sh*.5):shadeHex(col,sh),st*1.05,0)}}
    const cy=by-ry-h;
    for(let i=-rx;i<=rx;i+=st)for(let j=-ry;j<=ry;j+=st*.7){if((i/rx)**2+(j/ry)**2>1)continue;add(bx+i,cy+j,(Math.abs(i)<rw/2||Math.abs(j)<rw*.25)?rT:shadeHex(col,.32),st*1.05,0)}
    for(let i=0;i<48;i++){const a=i/48*Math.PI*2;add(bx+Math.cos(a)*rx,cy+Math.sin(a)*ry,shadeHex(col,.6),st*.65,1)}
    if(hasBow)bow(bx,cy,w,rib);

  };
  const ball=(bx,by,w,col,cap)=>{   // 圣诞球：有明暗和高光，顶上一个金属小帽

function slotScreen(i){const w=slotWorld(i);return proj(w.x,w.y,w.z)}
function giftU(i){return slotScreen(i).s*SLOTS[i].s}
function enterHeart(){if(S.stage!=='decorate')return;S.stage='heart';S.heartHold=0;setStepUI(4);$('tray').classList.add('hide');$('picker').classList.add('hide');
  const wr=proj(WAND_REST.x,WAND_REST.y,WAND_REST.z);S.wand.mode='fly';S.wand.fx=S.wand.x;S.wand.fy=S.wand.y;S.wand.ft=0;S.wand.tx=wr.x;S.wand.ty=wr.y}
function startSanta(){
  if(S.stage!=='heart')return;
  S.stage='heartburst';S.burstT=S.time;$('hint').classList.add('hide');setStepUI(5);$('steps').style.opacity='0';S.textMorph=0;S.cardShown=false;
  sfx('heart');setTimeout(()=>sfx('star'),120);burstHeart();
}
function launchSanta(){
  if(window.__santa3d&&window.__santa3d.ready){S.stage='santa3d';window.__santa3d.start(()=>{if(!S.cardShown){S.cardShown=true;setTimeout(showCard,400)}});return}
  S.stage='santa';if(!SANTA_P)buildSantaParticles();S.santa={t:0,face:1,bell:0,pose:null,hasWand:false};
}

function update(dt){
  S.time+=dt;S.rot+=dt*(.22+.48*(S.cardSpin||0)*(S.cardSpin||0));processHands();
  const st=S.stage;
  // 仙女棒位置
  const w=S.wand;
  if(w.mode==='hand'){if(INP.present){w.x=INP.x;w.y=INP.y;w.ang=lerp(w.ang,INP.ang,.3);w.alpha=Math.min(1,w.alpha+dt*3)}else w.alpha=Math.max(.0,w.alpha-dt*2)}
  else if(w.mode==='fly'){w.ft+=dt;const k=ease(clamp(w.ft/1.2,0,1));w.x=lerp(w.fx,w.tx,k);w.y=lerp(w.fy,w.ty,k)-Math.sin(k*Math.PI)*80;w.ang=lerp(w.ang,Math.PI/2+.35,.08);w.alpha=1;if(k>=1)w.mode='rest'}
  else if(w.mode==='rest'){const wr=proj(WAND_REST.x,WAND_REST.y,WAND_REST.z);w.x=wr.x;w.y=wr.y+Math.sin(S.time*2)*4;w.ang=Math.PI/2+.35;if(S.santa&&S.santa.t>4&&S.santa.tip){w.mode='toSanta';w.fx=w.x;w.fy=w.y;w.ft=0}}
  else if(w.mode==='toSanta'){w.ft+=dt;const k=ease(clamp(w.ft/1.1,0,1)),tg=S.santa.tip;w.x=lerp(w.fx,tg.x,k);w.y=lerp(w.fy,tg.y,k)-Math.sin(k*Math.PI)*120;w.ang+=dt*8*(1-k);if(k>=1){w.mode='none';S.santa.hasWand=true;sfx('pick')}}
  if((w.mode==='hand'||w.mode==='rest'||w.mode==='auto'||w.mode==='toSanta')&&w.alpha>.3&&Math.random()<.5)spark(w.x,w.y,Math.random()<.5?'#ffd77a':'#fff',1,.5,.8);

  if(st==='select'){
    const sw=detectSwipe();if(sw)step(sw);
    if(INP.pointDown)S.holdPoint+=dt;else S.holdPoint=Math.max(0,S.holdPoint-dt*2);
    setRing(S.holdPoint/.6);
    const cam=S.camOn;
    setHint(cam?'☝️':'🎨',cam?'食指朝上，往左或往右划一下再收回 = 换一个颜色':'点击上方，选择树的颜色',cam?'选好后把食指朝下停一下，召唤仙女棒':'选好后点右边按钮召唤仙女棒','召唤仙女棒 ✨',summonWand);
    if(S.holdPoint>=.6){S.holdPoint=0;setRing(0);summonWand()}
  }
  else if(st==='spiral'){
    setHint('🌀','从下往上，螺旋绕着树画',INP.src==='mouse'?'从树底的光点出发，沿着虚线一圈圈往上移动':'用仙女棒从树底的光点出发，沿着虚线一圈圈往上绕','自动种树',()=>{S.autoSpiral=true});
    if(S.autoSpiral){S.spiral=Math.min(SPN,S.spiral+SPN*dt/3.2);const p=spiralPts[Math.floor(S.spiral)];S.wand.mode='auto';S.wand.x=p.x;S.wand.y=p.y;S.wand.alpha=1;S.wand.ang=.9}
    else if(INP.present&&INP.pointerOk){const tol=Math.min(W,H)*.09,a=Math.floor(S.spiral),b=Math.min(SPN,a+Math.round(SPN*.12));let best=-1,bd=tol;
      for(let k=a;k<=b;k++){const p=spiralPts[k],d=Math.hypot(p.x-INP.x,p.y-INP.y);if(d<bd){bd=d;best=k}}
      if(best>S.spiral){if(Math.floor(best/20)>Math.floor(S.spiral/20))sfx('twinkle');S.spiral=best}
      S.trail.push({x:INP.x,y:INP.y,t:S.time});
    }
    S.grow=lerp(S.grow,S.spiral/SPN,Math.min(1,dt*3));setRing(S.spiral/SPN);
    if(S.spiral>=SPN*.95){setRing(0);finishGrow()}
  }
  else if(st==='growing'){S.grow=Math.min(1.25,S.grow+dt/1.4);setHint('🌟','圣诞树长好啦','星星正在点亮…','');if(S.grow>=1.25){sfx('star');enterDecorate()}}

  if(S.stage==='decorate'){
    const left=freeSlots().length,cam=INP.src==='hand'||S.camOn;
    if(!S.holding){const sw=detectSwipe();if(sw)step(sw)}
    setHint(S.holding?'🖐':'🤌',S.holding?'张开五指，放下礼物':(S.gifts.length?`再放一份礼物（还剩 ${left} 个位置）`:'五指聚拢，变出礼物'),
      S.holding?'移动手，选一个发光的位置再松开':(cam?'食指朝上划一下可以换灯光 · 五指聚拢对着镜头，礼物就出现':'按住鼠标变出礼物，拖到发光的位置松开'),
      S.gifts.length?'放好了，下一步 →':'',enterHeart);
    if(!S.holding&&INP.pinch&&left>0&&INP.present){
      if(S.usedStyles[S.nextStyle]){const n=S.usedStyles.indexOf(false);if(n>=0)S.nextStyle=n}
      S.holding={style:S.nextStyle,x:INP.gx,y:INP.gy,born:S.time};sfx('pop');spark(INP.gx,INP.gy,'#fff1c1',16,1);
    }
    if(S.holding){
      if(INP.present){S.lostT=0;S.holding.x=lerp(S.holding.x,INP.gx,.5);S.holding.y=lerp(S.holding.y,INP.gy,.5)}else S.lostT+=dt;
      let best=-1,bd=1e9;for(const i of freeSlots()){const p=slotScreen(i),d=Math.hypot(p.x-S.holding.x,(p.y-S.holding.y)*.6);if(d<bd){bd=d;best=i}}
      if(best!==S.hoverSlot&&best>=0)sfx('tick');S.hoverSlot=best;
      if(INP.present&&(INP.src==='mouse'?!mouse.down:INP.open)&&S.time-S.holding.born>.25){
        const g={slot:best,style:S.holding.style,fx:S.holding.x,fy:S.holding.y,t:0};S.gifts.push(g);S.usedStyles[g.style]=true;
        const n=S.usedStyles.indexOf(false);if(n>=0)S.nextStyle=n;S.holding=null;S.hoverSlot=-1;lastSwipe=S.time;updateTray();sfx('drop');
      }else if(S.lostT>1.2){spark(S.holding.x,S.holding.y,'#fff',20,1);S.holding=null;S.hoverSlot=-1}
    }
    if(S.gifts.length>=5&&S.gifts.every(g=>g.t>.8)){S.allDoneT=(S.allDoneT||0)+dt;if(S.allDoneT>.8)enterHeart()}
    if(INP.src==='hand'&&!S.holding){S.wand.x=INP.x;S.wand.y=INP.y}
  }
  if(S.stage==='decorate'){if(S.wand.mode==='hand'&&S.stage==='decorate')S.wand.alpha=S.holding?.0:Math.min(S.wand.alpha,.9)}
  if(S.stage==='heart'){
    setHint('🫶','双手比心','两手的拇指和食指尖碰在一起，比一个大大的心','比心 🫶',startSanta);
    if(INP.heart)S.heartHold+=dt;else S.heartHold=Math.max(0,S.heartHold-dt);setRing(S.heartHold/.7);
    if(S.heartHold>=.7){setRing(0);startSanta()}
  }
  if(S.stage==='heartburst'&&S.time-S.burstT>1.05)launchSanta();
  if(S.stage==='santa')santaUpdate(dt);
  for(const g of S.gifts)g.t+=dt;
}

// ============ 绘制 ============
function drawSpiralGuide(){
  const t=S.time,prog=S.spiral;ctx.globalCompositeOperation='lighter';
  for(let k=0;k<=SPN;k+=2){const p=spiralPts[k],done=k<=prog;
    if(done){ctx.globalAlpha=.9;const s=12;ctx.drawImage(sprite('#ffd77a','glow'),p.x-s/2,p.y-s/2,s,s)}
    else{const ahead=k-prog<SPN*.12;ctx.globalAlpha=(p.z>0?.42:.14)*(ahead?1.4:1)*(.7+.3*Math.sin(t*4-k*.15));const s=ahead?7:5;ctx.drawImage(sprite('#fff1c8','dot'),p.x-s/2,p.y-s/2,s,s)}}
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  // 起点
  if(prog<6){const p=spiralPts[0],r=14+6*Math.sin(t*5);ctx.save();ctx.strokeStyle='rgba(255,215,122,.9)';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.stroke();
    ctx.fillStyle='rgba(255,235,190,.9)';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText('从这里开始，往上绕',p.x,p.y+34);ctx.restore()}
  // 方向箭头
  for(let k=Math.ceil((prog+8)/22)*22;k<Math.min(SPN,prog+SPN*.4);k+=22){const a=spiralPts[k],b=spiralPts[Math.min(SPN,k+2)],ang=Math.atan2(b.y-a.y,b.x-a.x);
    ctx.save();ctx.translate(a.x,a.y);ctx.rotate(ang);ctx.globalAlpha=a.z>0?.7:.3;ctx.fillStyle='#ffd77a';ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(-4,-5);ctx.lineTo(-4,5);ctx.fill();ctx.restore()}
  // 幽灵仙女棒示范
  if(!S.autoSpiral&&(!INP.present||!INP.pointerOk||prog<4)){const g=Math.min(SPN,Math.floor(prog+((t*.4)%1)*SPN*.35)),p=spiralPts[g];drawWand(p.x,p.y,.9,.65,.35)}
}
function drawTrail(){
  const now=S.time;while(S.trail.length&&now-S.trail[0].t>.9)S.trail.shift();if(S.trail.length<2)return;
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';ctx.lineJoin='round';
  for(let i=1;i<S.trail.length;i++){const a=S.trail[i-1],b=S.trail[i],k=1-(now-b.t)/.9;ctx.strokeStyle=`rgba(255,215,122,${k*.8})`;ctx.lineWidth=2+k*6;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
  ctx.restore();
}
function drawSlots(){
  if(S.stage!=='decorate')return;const t=S.time;
  for(const i of freeSlots()){const p=slotScreen(i),on=i===S.hoverSlot,r=p.s*.32*(on?1.15+.08*Math.sin(t*6):1);
    ctx.save();ctx.translate(p.x,p.y);ctx.scale(1,.32);ctx.strokeStyle=on?'rgba(255,225,140,.95)':'rgba(255,225,140,.35)';ctx.lineWidth=on?4:2;ctx.setLineDash(on?[]:[5,7]);ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke();
    if(on){const g=ctx.createRadialGradient(0,0,0,0,0,r);g.addColorStop(0,'rgba(255,215,122,.45)');g.addColorStop(1,'rgba(255,215,122,0)');ctx.fillStyle=g;ctx.fill()}ctx.restore();
    if(on&&S.holding)drawGift(S.holding.style,p.x,p.y,giftU(i),.3+.1*Math.sin(t*6));
  }
}
function drawGifts(){
  const list=S.gifts.slice().sort((a,b)=>slotWorld(a.slot).z-slotWorld(b.slot).z);
  for(const g of list){const p=slotScreen(g.slot),u=giftU(g.slot),k=clamp(g.t/.55,0,1);
    if(k<1){const e=easeOut(k),x=lerp(g.fx,p.x,e),y=lerp(g.fy,p.y,k*k)-Math.sin(k*Math.PI)*60,uu=lerp(u*1.1,u,e);drawGift(g.style,x,y,uu)}
    else{if(!g.landed){g.landed=true;for(let i=0;i<24;i++)spark(p.x+rand(-u*.3,u*.3),p.y-u*.2,i%2?'#ffd77a':'#fff',1,1.1)}
      const sq=g.t<.8?1+Math.sin((g.t-.55)*30)*.06*(1-(g.t-.55)/.25):1;ctx.save();ctx.translate(p.x,p.y);ctx.scale(1/sq,sq);drawGift(g.style,0,0,u);ctx.restore()}
  }
}
function drawHeld(){
  if(!S.holding)return;const h=S.holding,k=easeOut(clamp((S.time-h.born)/.5,0,1)),u=giftU(2)*1.1;
  ctx.save();ctx.globalCompositeOperation='lighter';const gs=u*1.6;ctx.globalAlpha=.4*k;ctx.drawImage(sprite('#ffd77a','glow'),h.x-gs/2,h.y-gs*.6,gs,gs);ctx.restore();
  drawGift(h.style,h.x,h.y+u*.25+Math.sin(S.time*4)*3,u,1,k);if(Math.random()<.4)spark(h.x+rand(-u*.3,u*.3),h.y,'#fff1c1',1,.5,.7);
}
// 粒子爱心：实心亮点勾边 + 虚的闪烁粒子填充；比心越久越亮、越聚拢
const HEART=(()=>{const edge=[];for(let i=0;i<150;i++){const a=i/150*Math.PI*2;edge.push({x:Math.pow(Math.sin(a),3),y:-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))/16,edge:1,ph:Math.random()*7,c:Math.random()<.25?'#ffd77a':'#ff6f91'})}
  const inside=(x,y)=>{let c=false;for(let i=0,j=edge.length-1;i<edge.length;j=i++){const a=edge[i],b=edge[j];if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)c=!c}return c};
  const pts=edge.slice();let n=0;while(n<260){const x=rand(-1,1),y=rand(-.8,1.1);if(inside(x,y)){pts.push({x,y,edge:0,ph:Math.random()*7,c:Math.random()<.2?'#ffffff':(Math.random()<.5?'#ff9ab6':'#ff6f91')});n++}}return pts})();
let heartView={cx:0,cy:0,s:1};const heartBurst=[];
function burstHeart(){const {cx,cy,s}=heartView;
  for(const p of HEART){const x=cx+p.x*s,y=cy+p.y*s,a=Math.atan2(p.y-.1,p.x)+rand(-.35,.35),v=rand(160,420)*(p.edge?1.15:.8);heartBurst.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-rand(30,110),life:0,max:rand(.9,1.5),c:p.c,sz:p.edge?rand(7,10):rand(4,7)})}
  for(let i=0;i<70;i++)spark(cx+rand(-s*.4,s*.4),cy+rand(-s*.3,s*.3),['#ffd77a','#ff6f91','#ffffff','#ffb3c6'][i%4],1,2.2,1.2)}
function drawHeartGuide(dt=1/60){
  const t=S.time;
  if(S.stage==='heart'){
    const k=clamp(S.heartHold/.7,0,1),s=Math.min(W,H)*.105*(1+.04*Math.sin(t*3))*(1-.12*k),cx=W/2,cy=H*.17;heartView={cx,cy,s};
    ctx.globalCompositeOperation='lighter';
    const halo=s*3.2*(.6+.4*k);ctx.globalAlpha=.10+.22*k;ctx.drawImage(sprite('#ff6f91','glow'),cx-halo/2,cy-halo/2+s*.15,halo,halo);
    for(const p of HEART){const tw=.5+.5*Math.sin(t*3.2+p.ph),drift=(1-k)*s*.06;
      const x=cx+p.x*s+Math.sin(t*1.3+p.ph)*drift,y=cy+p.y*s+Math.cos(t*1.1+p.ph*1.3)*drift;
      ctx.globalAlpha=(p.edge?.6+.35*tw:.18+.4*tw)*(.45+.55*k);const z=(p.edge?7.5:4.5)*(1+.35*k)*(.75+.35*tw)*Math.max(.7,Math.min(W,H)/800);
      ctx.drawImage(sprite(p.c,'glow'),x-z/2,y-z/2,z,z)}
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  }
  if(heartBurst.length){ctx.globalCompositeOperation='lighter';
    for(let i=heartBurst.length-1;i>=0;i--){const p=heartBurst[i];p.life+=dt;if(p.life>p.max){heartBurst.splice(i,1);continue}
      p.vx*=.975;p.vy=p.vy*.975+150*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const k=1-p.life/p.max;
      ctx.globalAlpha=k*(.7+.3*Math.sin(p.life*30+i));const z=p.sz*(.6+.6*k);ctx.drawImage(sprite(p.c,'glow'),p.x-z/2,p.y-z/2,z,z)}
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1}
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.drawImage(bg,0,0,W,H);
  const _low=ctx;ctx=window.__up;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,W,H);drawOccluder();
  santaDraw(false);
  drawSlots();
  drawTree();
  drawGifts();
  if(S.stage==='spiral')drawSpiralGuide();
  drawTrail();
  drawText(dt);
  santaDraw(true);
  drawHeartGuide(dt);
  drawHeld();
  const w=S.wand;if(w.mode!=='none'&&!(S.stage==='decorate'&&S.holding))drawWand(w.x,w.y,w.ang,Math.min(W,H)/900,w.alpha);
  if((S.stage==='select'||S.stage==='decorate'&&!S.holding)&&INP.src==='hand'&&INP.pointUp){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.8;const s=34;ctx.drawImage(sprite('#ffd77a','glow'),INP.x-s/2,INP.y-s/2,s,s);
    ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(255,230,170,.85)';ctx.font='20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('‹',INP.x-30,INP.y);ctx.fillText('›',INP.x+30,INP.y);ctx.restore()}
  else if(S.stage==='select'&&INP.src==='hand'&&INP.present){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.5;const s=24;ctx.drawImage(sprite('#ffd77a','glow'),INP.x-s/2,INP.y-s/2,s,s);ctx.restore()}
  drawSparks(dt);drawSnow(dt);
  ctx=_low;cardLive(dt);
  requestAnimationFrame(frame);
}

function snapAll(){const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;const x=c.getContext('2d');x.drawImage(cv,0,0);x.drawImage(upc,0,0);x.drawImage(fxc,0,0);return c}
function buildCard(){
  const c=$('cardImg'),CW=1080,CH=1500;const g=c.getContext('2d'),th=THEMES[S.theme];
  const bgG=g.createLinearGradient(0,0,0,CH);bgG.addColorStop(0,th.sky[1]);bgG.addColorStop(1,'#05060c');g.fillStyle=bgG;g.fillRect(0,0,CW,CH);
  const top=Math.max(0,textBox.y-textBox.size*.85),gy=Math.min(H,proj(0,-1.28,0).y+H*.06),ch=gy-top;
  const cw=Math.min(W,Math.max((textBox.x1-textBox.x0)*1.08,ch*960/1060)),fit=Math.min(960/cw,1060/ch),dw=cw*fit,dh=ch*fit;
  g.save();roundRect(g,60,60,960,1060,28);g.clip();const sg=g.createLinearGradient(0,60,0,1120);sg.addColorStop(0,th.sky[0]);sg.addColorStop(1,th.sky[1]);g.fillStyle=sg;g.fillRect(60,60,960,1060);
  for(const L of [cv,upc,fxc])g.drawImage(L,(W/2-cw/2)*DPR,top*DPR,cw*DPR,ch*DPR,60+(960-dw)/2,60+(1060-dh)/2,dw,dh);g.restore();
  g.strokeStyle='#e9c46a';g.lineWidth=4;roundRect(g,60,60,960,1060,28);g.stroke();g.lineWidth=1.5;g.globalAlpha=.6;roundRect(g,40,40,1000,1420,40);g.stroke();g.globalAlpha=1;
  g.fillStyle='#ffd77a';g.textAlign='center';g.font='64px "Great Vibes",cursive';g.fillText('To '+($('toName').value||'亲爱的你'),CW/2,1210);
  g.font='30px "PingFang SC","Microsoft YaHei",sans-serif';g.fillStyle='#fff3dc';g.fillText('愿你的每一个愿望，都像这棵树上的灯一样被点亮。',CW/2,1275);
  g.font='24px "PingFang SC","Microsoft YaHei",sans-serif';g.fillStyle='rgba(255,243,220,.7)';
  g.fillText(`${th.name}的树 · ${LIGHTS[S.light].name} · ${S.gifts.length} 份礼物`,CW/2,1330);
  g.fillStyle='#ffd77a';g.font='44px "Great Vibes",cursive';g.fillText('From '+($('fromName').value||'Santa'),CW/2,1405);
  g.font='20px sans-serif';g.fillStyle='rgba(255,243,220,.5)';g.fillText('Christmas '+new Date().getFullYear(),CW/2,1440);

        for (const p of site.textPts()) if (p.on < 0 && p.rt <= uDone) { p.on = .3; p.sx = tipS.x; p.sy = tipS.y; }
      }
      emit(wpos(wand), wW > .3 ? 3 : 1, .12, [1, .85, .45], .45);
    }
    if (t > T.write1 + .55) for (const p of site.textPts()) if (p.on < 0) { p.on = .3; p.sx = p.fx; p.sy = p.fy; }
  }
  if (wandState === 'held' && t >= T.leave) emit(wpos(wand), 1, .12);
  S.textMorph = win(t, T.leave + .5, T.leave + 3.5);

  // 前后层：雪橇比树远时画在树后面，并让树身变实挡住他
  const depth = -sleigh.position.z; if (behind && depth < TREE_DEPTH - 1) behind = false; else if (!behind && depth > TREE_DEPTH + 1) behind = true;
  cv3.style.zIndex = behind ? 1 : 3;
  occ = lerp(occ, behind && t < T.end + .3 ? .93 : 0, 1 - Math.exp(-dt * 5)); window.__occ = occ;
  const visible = t < T.end + .2; sleigh.visible = visible; deer.forEach(d => d.root.visible = visible); reins.visible = visible;

  const rp = reinGeo.attributes.position, front = sleigh.localToWorld(V(0, 1.1, 2.35));
  deer.forEach((d, i) => { const h = d.root.localToWorld(V(0, 1.65, .55)); rp.setXYZ(i * 2, front.x, front.y, front.z); rp.setXYZ(i * 2 + 1, h.x, h.y, h.z); }); rp.needsUpdate = true;
  if (speed > 2 && visible) { for (const s of [-1, 1]) emit(sleigh.localToWorld(V(s * 1.05, -.6, -2.0)), 2, .25, [1, .8, .45], .3); deer.forEach(d => Math.random() < .5 && emit(d.root.localToWorld(V(0, .2, -.6)), 1, .3, [1, .9, .7], .3)); }
  updateParticles(dt);
  bellT -= dt; if (speed > 2 && visible && bellT <= 0) { bellT = .14; site.sfx('bell'); }
  if (!window.__noRender) renderer.render(scene, camera);
}

// ---------- 实时播放 + 对外接口 ----------
let running = false, last = 0, onDone = null, doneFired = false;
function loop(now) {
  if (!running) return;
  const dt = Math.min(.05, Math.max(.001, (now - last) / 1000)); last = now;
  step(dt);
  if (t > T.end + .4 && !doneFired) { doneFired = true; const cb = onDone; stop(); if (cb) cb(); return; }
  requestAnimationFrame(loop);
}
function stop() { running = false; window.__occ = 0; renderer.clear(); cv3.style.zIndex = 3; }
// 预先编译着色器，避免第一次出场时卡一下
setTimeout(() => { try { sleigh.visible = true; deer.forEach(d => d.root.visible = true); wand.visible = true; renderer.compile(scene, camera); } catch (e) {} resetState(); renderer.clear(); }, 300);
window.__santa3d = {
  ready: true,
  start(cb) { resetState(); onDone = cb; doneFired = false; running = true; last = performance.now(); requestAnimationFrame(loop); },
  reset() { stop(); resetState(); renderer.clear(); },
};

</script>
